apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-ticketing-config
data:
  application-prod.yaml: |-
    spring:
      datasource:
        url: {{ .Values.config.SPRING_DATASOURCE_URL | quote }}
      data:
        redis:
          host: {{ .Values.config.SPRING_DATA_REDIS_HOST | quote }}
          port: {{ .Values.config.SPRING_DATA_REDIS_PORT }}
          cluster:
            enabled: false