apiVersion: batch/v1
kind: CronJob
metadata:
  name: night-day-scheduler-night
spec:
  schedule: {{ .Values.schedules.night.cron | quote }}
  timeZone: {{ .Values.schedules.timezone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: {{ .Values.serviceAccount.name }}
          restartPolicy: OnFailure
          containers:
            - name: scheduler
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /bin/sh
                - -ec
                - |
                  echo "[night] pausing KEDA scaled objects at 0 replicas"
                  {{- range .Values.targets.scaledObjects }}
                  kubectl -n {{ .namespace }} annotate scaledobject/{{ .name }} autoscaling.keda.sh/paused=true autoscaling.keda.sh/paused-replicas="0" --overwrite || true
                  {{- end }}

                  echo "[night] scaling app deployments down to 0"
                  {{- range .Values.targets.deployments }}
                  kubectl -n {{ .namespace }} scale deployment/{{ .name }} --replicas=0
                  {{- end }}
