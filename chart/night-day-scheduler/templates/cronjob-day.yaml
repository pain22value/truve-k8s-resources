apiVersion: batch/v1
kind: CronJob
metadata:
  name: night-day-scheduler-day
spec:
  schedule: {{ .Values.schedules.day.cron | quote }}
  timeZone: {{ .Values.schedules.timezone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: {{ .Values.serviceAccount.name }}
          restartPolicy: OnFailure
          containers:
            - name: scheduler
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /bin/sh
                - -ec
                - |
                  echo "[day] scaling app deployments to daytime baseline"
                  {{- range .Values.targets.deployments }}
                  kubectl -n {{ .namespace }} scale deployment/{{ .name }} --replicas={{ default $.Values.schedules.day.baselineReplicas .dayReplicas }}
                  {{- end }}

                  echo "[day] resuming KEDA scaled objects"
                  {{- range .Values.targets.scaledObjects }}
                  kubectl -n {{ .namespace }} annotate scaledobject/{{ .name }} autoscaling.keda.sh/paused- autoscaling.keda.sh/paused-replicas- --overwrite || true
                  {{- end }}
