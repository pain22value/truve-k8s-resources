apiVersion: v1
kind: Service
metadata:
  name: queue-service
  labels:
    app: queue-service
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: http
  selector:
    app: queue-service