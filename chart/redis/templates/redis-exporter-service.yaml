{{- if .Values.redisExporter.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  labels:
    app: redis-exporter
spec:
  type: ClusterIP
  selector:
    app: redis-exporter
  ports:
    - name: metrics
      port: {{ .Values.redisExporter.service.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
