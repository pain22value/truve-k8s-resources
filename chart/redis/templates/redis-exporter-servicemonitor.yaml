{{- if and .Values.redisExporter.enabled .Values.redisExporter.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-exporter
  labels:
    app: redis-exporter
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: redis-exporter
  endpoints:
    - port: metrics
      interval: {{ .Values.redisExporter.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.redisExporter.serviceMonitor.scrapeTimeout }}
{{- end }}
