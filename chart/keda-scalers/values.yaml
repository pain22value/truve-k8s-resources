triggerAuthentication:
  enabled: false # 외부 인증이 필요한 scaler면 true로 바꾸고 사용하면 됨
  name: keda-trigger-auth # TriggerAuthentication 이름

scaledObjects:
  #####################################################################
  # gateway-service
  # 전체 요청이 가장 먼저 들어오는 진입점
  # 15,000명 부하 시 gateway 포화 여부를 먼저 확인해야 하므로 1차 적용
  #####################################################################
  - name: gateway-service
    namespace: truve-gateway-service
    enabled: true

    scaleTargetRef:
      name: gateway-service-gateway-service

    minReplicaCount: 1
    maxReplicaCount: 20
    pollingInterval: 15
    cooldownPeriod: 180

    type: prometheus
    prometheus:
      serverAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
      metricName: gateway_http_requests_per_second
      threshold: '75' # 15,000명 시 초당 75개의 요청이 들어온다고 가정 (평균 200ms 응답 시간 기준)
      query: |
        sum(
          rate(http_server_requests_seconds_count{namespace="truve-gateway-service"}[1m])
        )

  #####################################################################
  # ticketing-service
  # 좌석 조회 / 점유 / 예매 요청이 몰릴 핵심 서비스
  # gateway 다음으로 가장 먼저 병목 가능성이 높음
  #####################################################################
  - name: ticketing-service
    namespace: truve-ticketing-service
    enabled: true

    scaleTargetRef:
      name: ticketing-service-ticketing-service

    minReplicaCount: 1
    maxReplicaCount: 15
    pollingInterval: 15
    cooldownPeriod: 180 # 3분으로 짧게 잡아서 빠르게 대응하도록 설정

    type: prometheus
    prometheus:
      serverAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
      metricName: ticketing_http_requests_per_second
      threshold: '30'
      query: |
        sum(
          rate(http_server_requests_seconds_count{namespace="truve-ticketing-service"}[1m])
        )

  #####################################################################
  # auth-service
  # 로그인 / 토큰 발급 / 검증 구간이 부하 시작 시 병목이 될 수 있음
  # 부하테스트 시나리오에 로그인 포함 시 1차 적용 권장
  #####################################################################
  - name: auth-service
    namespace: truve-auth-service
    enabled: true

    scaleTargetRef:
      name: auth-service-auth-service

    minReplicaCount: 1
    maxReplicaCount: 8
    pollingInterval: 15
    cooldownPeriod: 180 # 3분으로 짧게 잡아서 빠르게 대응하도록 설정

    type: prometheus
    prometheus:
      serverAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
      metricName: auth_http_requests_per_second
      threshold: '20'
      query: |
        sum(
          rate(http_server_requests_seconds_count{namespace="truve-auth-service"}[1m])
        )

  #####################################################################
  # payment-service
  # 결제 완료 시나리오까지 부하테스트 범위에 포함될 때 2차 적용
  # 지금은 false로 두고 후속 튜닝 대상으로 관리
  #####################################################################
  - name: payment-service
    namespace: truve-payment-service
    enabled: true

    scaleTargetRef:
      name: payment-service-payment-service

    minReplicaCount: 1
    maxReplicaCount: 10
    pollingInterval: 15
    cooldownPeriod: 180

    type: prometheus
    prometheus:
      serverAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
      metricName: payment_http_requests_per_second
      threshold: '10'
      query: |
        sum(
          rate(http_server_requests_seconds_count{namespace="truve-payment-service"}[1m])
        )

  #####################################################################
  # queue-service
  # redis-exporter가 수집하는 queue prefix key group 기준으로 스케일
  # 실제 list length까지 필요하면 앱 또는 Lua script 메트릭으로 확장
  #####################################################################
  - name: queue-service
    namespace: truve-queue-service
    enabled: true

    scaleTargetRef:
      name: queue-service-queue-service

    minReplicaCount: 2
    maxReplicaCount: 50
    pollingInterval: 15
    cooldownPeriod: 120 # 큐 소비는 빠르게 대응하는 게 중요하므로 2분으로 짧게 설정

    type: prometheus
    prometheus:
      serverAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
      metricName: redis_queue_key_group_count
      threshold: '100'
      query: |
        sum(
          redis_key_group_count{key_group="queue"}
        )
