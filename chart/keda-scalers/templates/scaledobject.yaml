{{/* values.yaml의 scaledObjects 항목마다 ScaledObject를 하나씩 렌더링 */}}
{{- range .Values.scaledObjects }}
{{/* enabled=false면 매니페스트를 아예 만들지 않음 */}}
{{- if .enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject                          # KEDA가 HPA 생성을/관리를 위해 참조하는 핵심 리소스
metadata:
  name: {{ .name | quote }}                 # 생성될 ScaledObject의 이름
  namespace: {{ .namespace | quote }}       # 대상 리소스가 위치한 네임스페이스
spec:
  scaleTargetRef:                           # 스케일 대상 Workload(보통 Deployment) 이름
    name: {{ .scaleTargetRef.name | quote }} # kubectl get deploy -A 로 실제 배포 이름을 확인해 맞춰야 함

  minReplicaCount: {{ .minReplicaCount }}   # 스케일 인이 일어나도 이 수 아래로는 줄이지 않음
  maxReplicaCount: {{ .maxReplicaCount }}   # 최대 확장 가능한 복제본 수
  pollingInterval: {{ .pollingInterval }}   # KEDA가 이벤트를 체크하는 주기 (초 단위)
  cooldownPeriod: {{ .cooldownPeriod }}     # 메트릭이 내려간 뒤 scale down 하기 전 대기 시간 (초 단위)

  triggers:                                 # KEDA가 감시할 이벤트/메트릭 조건들
    {{/* Prometheus 쿼리 결과를 외부 메트릭으로 사용 */}}
    {{- if eq .type "prometheus" }}
    - type: prometheus
      metadata:
        serverAddress: {{ .prometheus.serverAddress | quote }} # 프로메테우스 서버 주소
        metricName: {{ .prometheus.metricName | quote }}       # KEDA 외부 메트릭 이름(HPA/어댑터에 노출될 식별자)
        query: |-                                              # 반드시 단일 숫자(스칼라)에 수렴하는 PromQL이어야 함
{{ .prometheus.query | nindent 10 }}
        threshold: {{ .prometheus.threshold | quote }}         # 이 값 1개당 replica 1개를 목표로 계산한다고 이해하면 됨
      {{/* Prometheus 접근에 인증이 필요한 경우 */}}
      {{- if .authenticationRef }}
      authenticationRef:
        name: {{ .authenticationRef.name | quote }}
      {{- end }}
    {{/* Kafka consumer lag 기반 스케일링 */}}
    {{- else if eq .type "kafka" }}
    - type: kafka
      metadata:
        bootstrapServers: {{ .kafka.bootstrapServers | quote }} # 카프카 브로커 주소
        consumerGroup: {{ .kafka.consumerGroup | quote }}       # 모니터링할 컨슈머 그룹
        topic: {{ .kafka.topic | quote }}                       # 대상 토픽
        lagThreshold: {{ .kafka.lagThreshold | quote }}         # lag가 이 값의 배수로 커질수록 필요한 replica 수가 증가
        offsetResetPolicy: {{ .kafka.offsetResetPolicy | quote }} # 오프셋 리셋 정책
      {{/* Kafka 연결 인증 정보 설정 */}}
      {{- if .authenticationRef }}
      authenticationRef:
        name: {{ .authenticationRef.name | quote }}
      {{- end }}
    {{- end }}
---
{{- end }}
{{- end }}
